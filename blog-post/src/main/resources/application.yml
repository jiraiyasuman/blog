```yaml
server:

  port: 8082

  compression:
    enabled: true

# =========================================================
# SPRING
# =========================================================

spring:

  application:
    name: post-service

  profiles:
    active: dev

  main:
    allow-bean-definition-overriding: true

  # =======================================================
  # MAIL
  # =======================================================

  mail:

    host: smtp.gmail.com
    port: 587

    username: your-email@gmail.com
    password: your-app-password

    properties:

      mail:

        smtp:

          auth: true

          starttls:
            enable: true

  # =======================================================
  # DATASOURCE
  # =======================================================

  datasource:

    # -----------------------------------------------------
    # WRITE SHARD 1
    # -----------------------------------------------------

    shard1:

      jdbc-url:
        jdbc:mysql://localhost:3306/post_write_shard_1

      username: root
      password: root

      driver-class-name:
        com.mysql.cj.jdbc.Driver

      hikari:

        pool-name: SHARD1-HIKARI

        maximum-pool-size: 20
        minimum-idle: 5

        idle-timeout: 30000
        connection-timeout: 20000
        max-lifetime: 1800000

    # -----------------------------------------------------
    # WRITE SHARD 2
    # -----------------------------------------------------

    shard2:

      jdbc-url:
        jdbc:mysql://localhost:3306/post_write_shard_2

      username: root
      password: root

      driver-class-name:
        com.mysql.cj.jdbc.Driver

      hikari:

        pool-name: SHARD2-HIKARI

        maximum-pool-size: 20
        minimum-idle: 5

        idle-timeout: 30000
        connection-timeout: 20000
        max-lifetime: 1800000

    # -----------------------------------------------------
    # WRITE SHARD 3
    # -----------------------------------------------------

    shard3:

      jdbc-url:
        jdbc:mysql://localhost:3306/post_write_shard_3

      username: root
      password: root

      driver-class-name:
        com.mysql.cj.jdbc.Driver

      hikari:

        pool-name: SHARD3-HIKARI

        maximum-pool-size: 20
        minimum-idle: 5

        idle-timeout: 30000
        connection-timeout: 20000
        max-lifetime: 1800000

    # -----------------------------------------------------
    # READ DATABASE
    # -----------------------------------------------------

    read:

      jdbc-url:
        jdbc:mysql://localhost:3306/post_read_db

      username: root
      password: root

      driver-class-name:
        com.mysql.cj.jdbc.Driver

      hikari:

        pool-name: READ-HIKARI

        maximum-pool-size: 40
        minimum-idle: 10

        idle-timeout: 30000
        connection-timeout: 20000
        max-lifetime: 1800000

  # =======================================================
  # JPA
  # =======================================================

  jpa:

    hibernate:
      ddl-auto: update

    show-sql: false

    open-in-view: false

    properties:

      hibernate:

        dialect:
          org.hibernate.dialect.MySQL8Dialect

        format_sql: true

        order_inserts: true
        order_updates: true

        generate_statistics: false

        default_batch_fetch_size: 100

        jdbc:

          batch_size: 50

          batch_versioned_data: true

  # =======================================================
  # KAFKA
  # =======================================================

  kafka:

    bootstrap-servers:
      - localhost:9092

    producer:

      acks: all
      retries: 5

      batch-size: 32768

      buffer-memory: 67108864

      compression-type: snappy

      key-serializer:
        org.apache.kafka.common.serialization.StringSerializer

      value-serializer:
        org.springframework.kafka.support.serializer.JsonSerializer

      properties:

        linger.ms: 10

        enable.idempotence: true

        max.in.flight.requests.per.connection: 5

    consumer:

      group-id: post-service-group

      auto-offset-reset: earliest

      enable-auto-commit: false

      max-poll-records: 100

      fetch-min-size: 1

      fetch-max-wait: 500

      key-deserializer:
        org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer:
        org.springframework.kafka.support.serializer.JsonDeserializer

      properties:

        spring:

          json:

            trusted:
              packages: "*"

    admin:
      auto-create: true

  # =======================================================
  # REDIS
  # =======================================================

  data:

    redis:

      host: localhost
      port: 6379

      timeout: 6000

      lettuce:

        pool:

          max-active: 20
          max-idle: 10
          min-idle: 5

  cache:
    type: redis

  # =======================================================
  # OPEN FEIGN
  # =======================================================

  cloud:

    openfeign:

      circuitbreaker:
        enabled: true

      client:

        config:

          default:

            connectTimeout: 3000
            readTimeout: 5000

# =========================================================
# EUREKA
# =========================================================

eureka:

  client:

    register-with-eureka: true

    fetch-registry: true

    service-url:

      defaultZone:
        http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

# =========================================================
# MANAGEMENT / ACTUATOR
# =========================================================

management:

  endpoints:

    web:

      exposure:

        include: "*"

  endpoint:

    health:

      show-details: always

  tracing:

    sampling:

      probability: 1.0

# =========================================================
# RESILIENCE4J
# =========================================================

resilience4j:

  circuitbreaker:

    instances:

      likeService:

        registerHealthIndicator: true

        slidingWindowSize: 10

        minimumNumberOfCalls: 5

        failureRateThreshold: 50

        waitDurationInOpenState: 10s

        permittedNumberOfCallsInHalfOpenState: 3

      commentService:

        registerHealthIndicator: true

        slidingWindowSize: 10

        minimumNumberOfCalls: 5

        failureRateThreshold: 50

        waitDurationInOpenState: 10s

  retry:

    instances:

      kafkaRetry:

        maxAttempts: 3

        waitDuration: 2s

  ratelimiter:

    instances:

      postRateLimiter:

        limitForPeriod: 20

        limitRefreshPeriod: 1d

        timeoutDuration: 0

# =========================================================
# JWT
# =========================================================

jwt:

  secret:
    mySuperSecretKeyForJWTGeneration

  expiration:
    86400000

# =========================================================
# CACHE TTL
# =========================================================

cache:

  ttl:

    posts: 600

    feed: 300

    trending: 120

# =========================================================
# KAFKA TOPICS
# =========================================================

topics:

  post-created:
    post-created-topic

  post-updated:
    post-updated-topic

  post-deleted:
    post-deleted-topic

  like-created:
    like-created-topic

  like-deleted:
    like-deleted-topic

  comment-created:
    comment-created-topic

  comment-deleted:
    comment-deleted-topic

  read-sync:
    post-read-sync-topic

  saga:
    saga-topic

  health-alert:
    health-alert-topic

# =========================================================
# LOGGING
# =========================================================

logging:

  level:

    root: INFO

    org.springframework.kafka: INFO

    org.hibernate.SQL: DEBUG

    io.github.resilience4j: INFO

  pattern:

    console:
      "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
```
